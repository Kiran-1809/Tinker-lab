<!DOCTYPE html>
<html>
<head>
    <title>Creating Box using HTML</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
        }
        .box {
            background-color: lightblue;
            padding: 20px;
            width: 200px;
            margin: 30px;
        }
        h2 {
            color: red;
        }
    </style>
</head>
<body>
    <div class="box" style="background-color: lightyellow;">
        This is Affiliated to SIU
    </div>

    <h2>CSS</h2>
    <div class="box" style="background-color: lightpink;">
        Internal CSS
    </div>

    <h2>CSS</h2>
    <div class="box" style="background-color: lightgreen;">
        External CSS.
    </div>

    <h2>CSS</h2>
    <div class="box" style="background-color: purple;">
        Inline CSS.
    </div>
</body>
</html>
