<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS</title>
    <style>
        body {
            background-color: lightyellow;
        }
        h1 {
            color: red;
        }
        p {
            color: black;
        }
    </style>
</head>
<body>
    <h1>Internal CSS</h1>
    <p>This is the <b>study</b> of internal CSS</p>

    <h1 style="color: blue;">Internal CSS in blue</h1>
    <p>Inline always <b>overlaps</b> Internal CSS</p>
    
    <h1>Internal CSS in next body</h1>
    <p style="color: blue;">This is the <b>Internal CSS</b> in next body</p>
</body>
</html>
